name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/main-status.yml .github/workflows/test.yml
  reusable-diagnostic:
    permissions:
      actions: read
    uses: ./.github/workflows/main-status.yml
